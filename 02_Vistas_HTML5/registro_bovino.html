<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Bovino - GanadoControl</title>
</head>
<body>
  <header>
    <h1>Registrar Nuevo Bovino / Cría</h1>
    <nav>
      <a href="index.html">Dashboard General</a> |
      <a href="registro_bovino.html">Registrar Bovino</a>
    </nav>
  </header>

  <hr>

  <main>
    <section>
      <!-- data-tabla declara contra qué tabla del DDL se valida este formulario; el gate de paridad (tools/paridad_ssot.mjs) lo exige. -->
      <form action="#" method="POST" data-tabla="bovinos">
        <fieldset>
          <legend><strong>Datos del Animal</strong></legend>
          <br>

          <label for="txtIdBovino">Código interno del bovino:</label><br>
          <input type="text" id="txtIdBovino" name="id_bovino" placeholder="Ej: BOV-016" required><br><br>

          <label for="selFinca">Finca:</label><br>
          <select id="selFinca" name="id_finca" required>
            <option value="">-- Seleccionar Finca --</option>
            <option value="1">Finca La Esperanza</option>
            <option value="2">Finca El Porvenir</option>
          </select><br><br>

          <p><strong>Sexo:</strong></p>
          <!-- value debe ser el VOCABULARIO DE LA BASE ('Hembra'/'Macho'): el CHECK de
               bovinos.sexo lo rechaza todo lo demás, así que enviar 'H'/'M' hacía fallar
               el alta aunque el formulario validara "ok". -->
          <label><input type="radio" name="sexo" value="Hembra" checked required> Hembra (Vaca / Novilla / Ternera)</label><br>
          <label><input type="radio" name="sexo" value="Macho"> Macho (Toro / Novillo)</label><br><br>

          <label for="selRaza">Raza Genética:</label><br>
          <select id="selRaza" name="id_raza" required>
            <option value="">-- Seleccionar Raza --</option>
            <option value="1">Brahman (Carne)</option>
            <option value="2">Gyr (Leche)</option>
            <option value="3">Holstein (Leche)</option>
            <option value="4">Normando (Doble Propósito)</option>
            <option value="5">Jersey (Leche)</option>
          </select><br><br>

          <label for="selPotrero">Potrero Asignado:</label><br>
          <select id="selPotrero" name="id_potrero" required>
            <option value="">-- Seleccionar Lote --</option>
            <option value="1">Potrero 01 - Lote Ordeño 1 (Estrella)</option>
            <option value="7">Potrero 07 - Novillas Vientre (Kikuyo)</option>
            <option value="11">Potrero 11 - Cunas y Destete (Corte Cuba 22)</option>
            <option value="16">Potrero 16 - Maternidad / Preparto (Kikuyo)</option>
          </select><br><br>

          <label for="txtFechaNac">Fecha de Nacimiento:</label><br>
          <input type="date" id="txtFechaNac" name="fecha_nacimiento" required><br><br>

          <label for="selEstadoFisiologico">Estado Fisiológico:</label><br>
          <select id="selEstadoFisiologico" name="estado_fisiologico" required>
            <option value="Novilla_Vientre" selected>Novilla / Vientre</option>
            <option value="En_Ordeño">En Ordeño</option>
            <option value="Horra_Seca">Horra / Seca</option>
            <option value="Ternero_Crecimiento">Ternero / Crecimiento</option>
            <option value="Toro_Reproductor">Toro Reproductor</option>
          </select><br><br>

          <label for="selEstadoVital">Estado Vital:</label><br>
          <select id="selEstadoVital" name="estado_vital" required>
            <option value="Activo" selected>Activo</option>
            <option value="Muerto">Muerto</option>
            <option value="Vendido">Vendido</option>
            <option value="Descarte">Descarte</option>
          </select><br><br>
        </fieldset>

        <br>

        <input type="submit" value="Guardar Registro en el Hato">
        <input type="reset" value="Limpiar">
      </form>
    </section>
  </main>

  <hr>

  <footer>
    <p><small>&copy; 2026 GanadoControl - CESDE</small></p>
  </footer>
</body>
</html>
